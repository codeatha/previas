<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Padaria Teste | O melhor da panificação em Mogi Guaçu</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #E65100;
            --primary-dark: #b84000;
            --secondary: #3E2723;
            --bg-clean: #FAFAFA;
            --text-main: #212121;
            --text-muted: #666666;
            --whatsapp: #25D366;
            --whatsapp-dark: #1EBE5D;
            --white: #FFFFFF;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-clean);
            color: var(--text-main);
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: var(--secondary);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Botões */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-whatsapp {
            background-color: var(--whatsapp);
            color: var(--white);
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-dark);
            transform: translateY(-2px);
        }

        /* Header */
        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary);
        }

        .logo span {
            color: var(--primary);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-link {
            font-weight: 500;
            color: var(--text-main);
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--secondary);
        }

        /* Hero Section */
        .hero {
            padding: 160px 0 100px;
            background: linear-gradient(135deg, rgba(62, 39, 35, 0.05) 0%, rgba(230, 81, 0, 0.05) 100%);
            min-height: 90vh;
            display: flex;
            align-items: center;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--secondary);
        }

        .hero-content h1 span {
            color: var(--primary);
        }

        .hero-content p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .hero-card {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            border-bottom: 5px solid var(--primary);
        }

        .hero-card i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .hero-card h3 {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .hero-card p {
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* Seção Produtos/Destaques */
        .produtos {
            padding: 100px 0;
            background-color: var(--white);
        }

        .section-title {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 60px;
        }

        .section-title h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .section-title p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .produtos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .produto-card {
            background: var(--bg-clean);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.04);
        }

        .produto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .produto-icon {
            height: 160px;
            background: linear-gradient(135deg, var(--secondary), #5c3a35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 3.5rem;
        }

        .produto-info {
            padding: 25px;
        }

        .produto-info h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
        }

        .produto-info p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* Seção Sobre / Diferenciais */
        .sobre {
            padding: 100px 0;
            background-color: var(--bg-clean);
        }

        .sobre-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .sobre-text h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .sobre-text p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .features-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: var(--secondary);
        }

        .feature-item i {
            color: var(--primary);
            font-size: 1.25rem;
        }

        .sobre-box-visual {
            background: var(--secondary);
            color: var(--white);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .sobre-box-visual i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .sobre-box-visual h3 {
            color: var(--white);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .sobre-box-visual p {
            color: #d1d1d1;
            margin-bottom: 30px;
        }

        /* Seção Contato / Localização */
        .contato {
            padding: 100px 0;
            background-color: var(--white);
        }

        .contato-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .info-card {
            background: var(--bg-clean);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .info-card h3 {
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item i {
            color: var(--primary);
            font-size: 1.25rem;
            margin-top: 4px;
        }

        .info-item div h4 {
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .info-item div p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .map-container {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            height: 100%;
            min-height: 350px;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Footer */
        footer {
            background-color: var(--secondary);
            color: var(--white);
            padding: 40px 0;
            text-align: center;
        }

        footer p {
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Botão Flutuante do WhatsApp */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--whatsapp);
            color: var(--white);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 999;
            transition: var(--transition
